spring.application.name=practica-03-buscador-peliculas
text.system=Utiliza todo el contexto proporcionado sin filtrar ni descartar ningún elemento.\
			A partir del contexto, y teniendo en cuenta la preferencia del usuario sobre el tipo de película que le gustaría ver, genera una respuesta en formato JSON que incluya todas las películas mencionadas en el contexto.\
			Cada elemento del JSON debe tener las siguientes propiedades:\
			'titulo': título de la película,\
			'anio': año de estreno,\
            'gradoAdecuacion': grado de adecuación a los criterios en porcentaje.\
			Contexto:{contexto}

#spring.ai.openai.api-key=${OPENAI_API_KEY}
#spring.ai.openai.chat.model=gpt-4.1-mini
#spring.ai.ollama.embedding.model=mxbai-embed-large
spring.ai.ollama.init.pull-model-strategy=when_missing
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3
spring.ai.ollama.chat.temperature=0.2
#spring.ai.ollama.chat.max-tokens=150
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=peliculas
spring.ai.vectorstore.qdrant.initialize-schema=true
server.port=8001
